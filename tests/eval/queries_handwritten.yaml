# Hand-written cross-lingual benchmark queries (spec FR-018a).
# Each pair says the same thing in English and Swedish. expected_codes lists every SSYK 2012 code
# that is an acceptable answer. Swedish wording to be reviewed by a native speaker before results
# are published (spec Assumptions).

