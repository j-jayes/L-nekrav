# --- one sentence of duties ---------------------------------------------------------------------
- id: d-civil-eng
  type: duty_sentence
  text_en: Designs bridges and road structures and calculates loads for construction projects.
  text_sv: Konstruerar broar och vägkonstruktioner och beräknar laster i byggprojekt.
  expected_codes: ["2142"]
- id: d-payroll
  type: duty_sentence
  text_en: Handles monthly payroll, holiday pay and employee records for the company.
  text_sv: Hanterar månadslöner, semesterersättning och personaluppgifter för företaget.
  expected_codes: ["4112"]
- id: d-it-support
  type: duty_sentence
  text_en: Helps employees with laptop, password and printer problems by phone and in person.
  text_sv: Hjälper anställda med problem med datorer, lösenord och skrivare via telefon och på plats.
  expected_codes: ["3512"]
- id: d-buyer
  type: duty_sentence
  text_en: Negotiates contracts with suppliers and runs public procurement tenders.
  text_sv: Förhandlar avtal med leverantörer och genomför offentliga upphandlingar.
  expected_codes: ["3323"]
- id: d-translator
  type: duty_sentence
  text_en: Translates legal and technical documents between English and Swedish.
  text_sv: Översätter juridiska och tekniska dokument mellan engelska och svenska.
  expected_codes: ["2643"]
- id: d-physio
  type: duty_sentence
  text_en: Assesses patients after injuries and plans exercise programmes to restore movement.
  text_sv: Bedömer patienter efter skador och planerar träningsprogram för att återställa rörligheten.
  expected_codes: ["2272"]
- id: d-cleaner
  type: duty_sentence
  text_en: Cleans offices, hotel rooms and stairwells on a daily schedule.
  text_sv: Städar kontor, hotellrum och trapphus enligt ett dagligt schema.
  expected_codes: ["9111"]
- id: d-electrician
  type: duty_sentence
