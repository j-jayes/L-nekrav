[project]
name = "lonekrav"
version = "0.1.0"
description = "The SSYK and salary navigator for Swedish work permits"
authors = [
    { name = "Jonathan Jayes", email = "j0nathanjayes@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
]

[project.scripts]
lonekrav = "lonekrav:main"

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
