[project]
name = "lonekrav"
version = "0.1.0"
description = "The SSYK and salary navigator for Swedish work permits"
authors = [
    { name = "Jonathan Jayes", email = "j0nathanjayes@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[fastapi]>=1.2.3,<2",
    "fastapi>=0.158.2",
    "fastmcp>=4.1.3,<5",
    "httpx>=0.28.1",
    "openai>=3.36.1,<4",
    "openpyxl>=3.1.5",
    "polars>=2.0.0",
    "psutil>=7.2.2",
    "pydantic>=2.14.1",
    "pymilvus[milvus-lite]>=3",
    "pypdf>=6.21.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6",
    "snowballstemmer>=3.1.1",
    "torch>=2.14.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
lonekrav-etl = "lonekrav.etl.cli:main"
lonekrav-serve = "lonekrav.app:main"

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

# Linux (the container image) takes CPU-only torch: PyPI's Linux wheels pull in the CUDA stack,
# gigabytes the CPU-only server never loads. macOS keeps PyPI's wheel, which is CPU-only already.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not benchmark and not live' --import-mode=importlib"
markers = [
    "benchmark: full cross-lingual benchmark with real models (slow, needs model downloads)",
    "live: calls a real external service: OpenRouter (needs OPENROUTER_KEY, costs a little) or JobSearch (needs network)",
]

[tool.ruff]
line-length = 100
