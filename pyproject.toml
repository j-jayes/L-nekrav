[project]
name = "lonekrav"
version = "0.1.0"
description = "The SSYK and salary navigator for Swedish work permits"
authors = [
    { name = "Jonathan Jayes", email = "j0nathanjayes@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "polars>=2.0.0",
    "psutil>=7.2.2",
    "pydantic>=2.14.1",
    "pymilvus[milvus-lite]>=3",
    "pypdf>=6.21.1",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6",
    "snowballstemmer>=3.1.1",
]

[project.scripts]
lonekrav-etl = "lonekrav.etl.cli:main"

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not benchmark' --import-mode=importlib"
markers = ["benchmark: full cross-lingual benchmark with real models (slow, needs model downloads)"]

[tool.ruff]
line-length = 100
