# The LegalConstants registry (constitution Principle II). Every salary rule, median, code list and
# legal statement Lönekrav uses lives here and nowhere else in code. Review every June when SCB
# publishes a new median, and whenever Migrationsverket announces a rule change; the test
# `test_registry_holds_this_years_median` fails from 23 June if the update is missed.
#
# Sources are referenced by key; every row names one. `checked_on` is the date a person last
# compared the row with its source.

sources:
  mv_lonekrav:
    title: "Migrationsverket: Lönekrav för arbetstillstånd"
    url: https://www.migrationsverket.se/ordforklaringar/lonekrav-for-arbetstillstand
    checked_on: 2026-10-21
  mv_god_forsorjning:
    title: "Migrationsverket: God försörjning – försörjningskrav för arbetstillstånd"
    url: https://www.migrationsverket.se/ordforklaringar/god-forsorjning---forsorjningskrav-for-arbetstillstand.html
    checked_on: 2026-10-21
  mv_employees:
    title: "Migrationsverket: Employees (work permit requirements)"
    url: https://www.migrationsverket.se/en/you-want-to-apply/work/employee-or-self-employed/employees.html
    checked_on: 2026-10-21
  sfs_2026_605:
    title: "SFS 2026:605, utlänningsförordningen 5 kap. 5–6 §§"
    url: https://svenskforfattningssamling.se/doc/2026605.html
    checked_on: 2026-10-20

# SCB's national median monthly salary as Migrationsverket applies it: each one governs applications
# filed from the day it takes effect until the day before the next. Published in June for the
# previous reference year.
medians:
  - {amount: 32400, scb_reference_year: 2020, effective_from: 2021-06-22, source: mv_lonekrav}
  - {amount: 33200, scb_reference_year: 2021, effective_from: 2022-06-21, source: mv_lonekrav}
  - {amount: 34200, scb_reference_year: 2022, effective_from: 2023-06-20, source: mv_lonekrav}
  - {amount: 35600, scb_reference_year: 2023, effective_from: 2024-06-18, source: mv_lonekrav}
  - {amount: 37100, scb_reference_year: 2024, effective_from: 2025-06-17, source: mv_lonekrav}
  - {amount: 38300, scb_reference_year: 2025, effective_from: 2026-06-16, source: mv_lonekrav}

# Earliest and latest day of the year a median has taken effect (from the rows above). Before the
# earliest day, last year's median is current; after the latest, a missing median is overdue.
median_publication_window:
  earliest: "06-16"
  latest: "06-22"
  source: mv_lonekrav

rules:
  flat_13000:
    kind: flat
    amount: 13000
    effective_from: null  # start date not recorded here; shown in the timeline only
    effective_to: 2023-10-31
    applies_to: "Maintenance requirement before 1 November 2023: at least 13 000 SEK a month."
    source: mv_god_forsorjning
  maintenance_80:
    kind: share_of_median
    percent: 80
    effective_from: 2023-11-01
    effective_to: 2026-05-31
    applies_to: "Maintenance requirement (god försörjning): at least 80 % of the median."
    source: mv_god_forsorjning
  salary_90:
    kind: share_of_median
    percent: 90
    effective_from: 2026-06-01
    applies_to: >-
      Salary requirement for first permits decided from 1 June 2026 and for extensions not
      covered by the transition: at least 90 % of the median in force when the application was
      filed.
    source: mv_lonekrav
  salary_75_exempt:
    kind: share_of_median
    percent: 75
    effective_from: 2026-06-01
    applies_to: >-
      Occupations on the government's exempt list, and applicants in an exempt group: at least
      75 % of the median.
    source: mv_lonekrav
  transition_maintenance_80:
    kind: share_of_median
    percent: 80
    effective_from: 2026-06-01
    effective_to: 2026-12-01
    permits_granted_before: 2026-06-01
    applies_to: >-
      Extensions filed 1 June–1 December 2026 for a permit granted before 1 June 2026 keep the
      earlier maintenance requirement: at least 80 % of the median, with no 75 % exemption.
    source: mv_god_forsorjning

code_lists:
  exempt_75:
    effective_from: 2026-06-01
    source: sfs_2026_605
    note: "5 kap. 6 §: the 90 % requirement does not apply; 75 % of the median applies instead."
    codes: {"3115": "", "3215": "", "3511": "", "3512": "", "3513": "", "3514": "", "5321": "", "5322": "", "5323": "", "5324": "", "5325": "", "5326": "", "5330": "", "6121": "", "6129": "", "6130": "", "6210": "", "7212": "", "7215": "", "7233": "", "7413": "", "7611": "", "8161": "", "8169": "", "8199": "", "8341": "", "9210": ""}
  banned:
    effective_from: 2026-06-01
    source: sfs_2026_605
    note: "5 kap. 5 §: work permits may not be granted."
    codes: {"5343": ""}
  partially_banned:
    effective_from: 2026-06-01
    source: sfs_2026_605
    note: "5 kap. 5 §: work permits may not be granted for part of this occupation."
    codes: {"9210": "forest berry pickers only (bärplockare i skog)"}

exemptions:
  former_student_researcher:
    label: "Former student or researcher"
    conditions: >-
      Holds a residence permit as a student or researcher in Sweden when applying for a work
      permit for the first time.
    first_permit_only: true
    source: mv_lonekrav
  temporary_protection:
    label: "Temporary protection (EU mass-displacement directive)"
    conditions: >-
      Holds a residence permit with or after temporary protection under the EU
      mass-displacement directive. Exempt for two years, or until that permit ends if it is
      valid for longer.
    first_permit_only: false
    source: mv_lonekrav
  healthcare_licensing:
    label: "Doctor, dentist or nurse becoming licensed"
    conditions: >-
      A doctor, dentist or nurse with a foreign degree who is in the process of obtaining a
      Swedish licence to practise.
    first_permit_only: false
    source: mv_lonekrav
  young_tech_company:
    label: "Employee of a young tech or life-science company"
    conditions: >-
      Employed by a tech or life-science company that is being built up, is less than five
      years old and has fewer than 100 employees.
    first_permit_only: false
    source: mv_lonekrav

statements:
  part_time:
    text: >-
      The requirement applies to the monthly salary actually paid. Migrationsverket states it as
      "a monthly salary or wages totalling at least" the threshold and gives no reduction for
      part-time work, so a part-time salary must still reach the full amount.
    source: mv_employees
  partial_ban_9210:
    text: >-
      Work permits cannot be granted for forest berry pickers (bärplockare i skog), even though
      the occupation group is otherwise on the exempt list. Other jobs in the group are covered
      by the 75 % level.
    source: mv_lonekrav
  out_of_scope:
    text: >-
      Lönekrav covers ordinary work permits decided under the rules in force from 1 June 2026.
      Earlier decisions, extensions filed before that date, EU Blue Cards, ICT permits, seasonal
      work and other permit types follow other rules.
    source: mv_lonekrav
